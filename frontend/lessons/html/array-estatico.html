<!-- Barra Superior / Header de Navegación -->
<div class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 px-3 py-3 rounded-t-2xl">
    <div class="w-full mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
        
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-blue-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-cubes text-slate-950 text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-emerald-400">
                    Anatomía de un Arreglo en Memoria
                </h1>
                <p class="text-xs text-slate-400">Estructuras de Datos explicadas paso a paso y 100% visuales</p>
            </div>
        </div>

        <!-- Scene Navigation Stepper -->
        <!-- CONEXIÓN JS: Cada botón ejecuta loadScene(n) definido en array-in-memory.js -->
        <nav class="flex items-center gap-1 sm:gap-2 bg-slate-950/70 p-1.5 rounded-2xl border border-slate-800/80 text-xs sm:text-sm overflow-x-auto max-w-full">
            <button onclick="loadScene(1)" id="nav-btn-1" class="nav-btn px-3 py-1.5 rounded-xl font-medium transition-all flex items-center gap-2 text-indigo-400 bg-indigo-950/60 border border-indigo-500/40 shadow-sm">
                <span class="w-5 h-5 rounded-full bg-indigo-500 text-slate-950 flex items-center justify-center text-xs font-mono font-bold">1</span>
                <span class="hidden md:inline font-semibold">1. Casilleros Pegados</span>
            </button>
            <div class="w-3 h-px bg-slate-800"></div>
            <button onclick="loadScene(2)" id="nav-btn-2" class="nav-btn px-3 py-1.5 rounded-xl font-medium transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200">
                <span class="w-5 h-5 rounded-full bg-slate-800 flex items-center justify-center text-xs font-mono font-bold">2</span>
                <span class="hidden md:inline font-semibold">2. El Índice es Contar Pasos</span>
            </button>
        </nav>

        <!-- Sound & Helper Tools -->
        <!-- CONEXIÓN JS: Invoca toggleSound() para activar/desactivar el sintetizador WebAudio API -->
        <div class="flex items-center gap-2">
            <button id="sound-btn" onclick="toggleSound()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-all text-sm border border-slate-700/50" title="Activar/Desactivar Sonido">
                <i class="fa-solid fa-volume-high text-indigo-400" id="sound-icon"></i>
            </button>
        </div>
    </div>
</div>

<!-- Contenedor Principal de Escenas y Footer -->
<div class="flex-1 w-full mx-auto p-2 md:p-4 flex flex-col gap-6 justify-between relative">
    
    <!-- Scene Canvas Viewport Container -->
    <!-- CONEXIÓN JS: Este contenedor id="scene-viewport" es donde array-in-memory.js dibuja dinámicamente cada escena (renderScene1, renderScene2, renderScene3) -->
    <div id="scene-viewport" class="relative bg-slate-900/60 border border-slate-800 rounded-3xl p-4 md:p-8 min-h-[480px] flex flex-col justify-center items-center shadow-2xl overflow-hidden backdrop-blur-xl">
        <!-- Dynamic Content loaded by JS -->
    </div>

    <!-- Footer Controls & Context Explanation -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 md:p-5 flex flex-col md:flex-row items-center justify-between gap-4 backdrop-blur-md">
        <div class="flex items-start gap-4">
            <div id="scene-icon-badge" class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0 mt-0.5">
                <i class="fa-solid fa-lightbulb text-lg"></i>
            </div>
            <div>
                <!-- CONEXIÓN JS: Título y Descripción que cambian según la escena cargada -->
                <h3 id="scene-title" class="font-bold text-slate-200 text-base">Escena 1 — Los Casilleros Pegados</h3>
                <p id="scene-description" class="text-sm text-slate-400 mt-0.5 leading-relaxed">
                    Un arreglo es una fila de casilleros pegados en la RAM, sin espacios vacíos y de tamaño reservado de antemano.
                </p>
            </div>
        </div>

        <!-- Scene Control Action Buttons -->
        <!-- CONEXIÓN JS: Controlan la navegación anterior y siguiente invocando prevScene() y nextScene() -->
        <div class="flex items-center gap-3 shrink-0">
            <button id="prev-scene-btn" onclick="prevScene()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-40 disabled:hover:bg-slate-800 text-sm font-semibold transition-all flex items-center gap-2 border border-slate-700">
                <i class="fa-solid fa-arrow-left text-xs"></i> Anterior
            </button>
            <button id="next-scene-btn" onclick="nextScene()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-indigo-500 to-blue-500 hover:from-indigo-400 hover:to-blue-400 text-slate-950 font-bold text-sm shadow-lg shadow-indigo-500/20 transition-all flex items-center gap-2">
                Siguiente <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div>
</div>
