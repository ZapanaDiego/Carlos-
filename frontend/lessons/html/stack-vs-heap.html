<div class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 px-2 py-3 rounded-t-2xl">
    <div class="w-full mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
        
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
            <div
                class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 via-indigo-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-layer-group text-slate-950 text-xl"></i>
            </div>
            <div>
                <h1
                    class="font-bold text-lg leading-tight tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-emerald-300 to-purple-400">
                    Stack vs Heap: La Arquitectura Física
                </h1>
                <p class="text-xs text-slate-400">Laboratorio Visual de Gestión de Memoria y Vulnerabilidades</p>
            </div>
        </div>

        <!-- Scene Navigation Stepper -->
        <!-- CONEXIÓN JS: Cada botón ejecuta loadScene(n) definido en stack-vs-heap.js -->
        <nav
            class="flex items-center gap-1 sm:gap-2 bg-slate-950/70 p-1.5 rounded-2xl border border-slate-800/80 text-xs sm:text-sm overflow-x-auto max-w-full">
            <button onclick="loadScene(1)" id="nav-btn-1"
                class="nav-btn px-3 py-1.5 rounded-xl font-medium transition-all flex items-center gap-2 text-blue-400 bg-blue-950/60 border border-blue-500/40 shadow-sm">
                <span
                    class="w-5 h-5 rounded-full bg-blue-500 text-slate-950 flex items-center justify-center text-xs font-mono font-bold">1</span>
                <span class="hidden md:inline">El Stack (Automático)</span>
            </button>
            <div class="w-3 h-px bg-slate-800"></div>
            <button onclick="loadScene(2)" id="nav-btn-2"
                class="nav-btn px-3 py-1.5 rounded-xl font-medium transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200">
                <span
                    class="w-5 h-5 rounded-full bg-slate-800 flex items-center justify-center text-xs font-mono font-bold">2</span>
                <span class="hidden md:inline">El Heap (Dinámico)</span>
            </button>
            <div class="w-3 h-px bg-slate-800"></div>
            <button onclick="loadScene(3)" id="nav-btn-3"
                class="nav-btn px-3 py-1.5 rounded-xl font-medium transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200">
                <span
                    class="w-5 h-5 rounded-full bg-slate-800 flex items-center justify-center text-xs font-mono font-bold">3</span>
                <span class="hidden md:inline">Los 3 Errores Críticos</span>
            </button>
        </nav>

        <!-- Sound & Helper Tools -->
        <!-- CONEXIÓN JS: Invoca toggleSound() para activar/desactivar el sintetizador WebAudio API -->
        <div class="flex items-center gap-2">
            <button id="sound-btn" onclick="toggleSound()"
                class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-all text-sm border border-slate-700/50"
                title="Activar/Desactivar Sonido">
                <i class="fa-solid fa-volume-high text-blue-400" id="sound-icon"></i>
            </button>
        </div>
    </div>
</div>

<div class="flex-1 w-full mx-auto p-2 md:p-4 flex flex-col gap-6 justify-between relative">
    
    <!-- Scene Canvas Viewport Container -->
    <!-- CONEXIÓN JS: Este contenedor id="scene-viewport" es donde stack-vs-heap.js dibuja dinámicamente cada escena (renderScene1, renderScene2, renderScene3) -->
    <div id="scene-viewport"
        class="relative bg-slate-900/60 border border-slate-800 rounded-3xl p-4 md:p-8 min-h-[460px] flex flex-col justify-center items-center shadow-2xl overflow-hidden backdrop-blur-xl">
        <!-- Dynamic Content loaded by JS -->
    </div>

    <!-- Footer Controls & Context Explanation -->
    <div
        class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 md:p-5 flex flex-col md:flex-row items-center justify-between gap-4 backdrop-blur-md">
        <div class="flex items-start gap-4">
            <div
                class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center shrink-0 mt-0.5">
                <i class="fa-solid fa-lightbulb text-lg"></i>
            </div>
            <div>
                <!-- CONEXIÓN JS: Título y Descripción que cambian según la escena cargada -->
                <h3 id="scene-title" class="font-bold text-slate-200 text-base">Escena 1 — El Stack: Memoria Automática y
                    Rápida</h3>
                <p id="scene-description" class="text-sm text-slate-400 mt-0.5 leading-relaxed">
                    Pila LIFO organizada en Stack Frames. Por convención crece hacia direcciones más bajas.
                </p>
            </div>
        </div>

        <!-- Scene Control Action Buttons -->
        <!-- CONEXIÓN JS: Controlan la navegación anterior y siguiente invocando prevScene() y nextScene() -->
        <div class="flex items-center gap-3 shrink-0">
            <button id="prev-scene-btn" onclick="prevScene()"
                class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-40 disabled:hover:bg-slate-800 text-sm font-semibold transition-all flex items-center gap-2 border border-slate-700">
                <i class="fa-solid fa-arrow-left text-xs"></i> Anterior
            </button>
            <button id="next-scene-btn" onclick="nextScene()"
                class="px-5 py-2 rounded-xl bg-gradient-to-r from-blue-500 to-emerald-500 hover:from-blue-400 hover:to-emerald-400 text-slate-950 font-bold text-sm shadow-lg shadow-blue-500/20 transition-all flex items-center gap-2">
                Siguiente <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div>
</div>
