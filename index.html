<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos++ | Simulador de Memoria</title>
    <link rel="stylesheet" href="./frontend/css/style.css">
    <script defer src="./frontend/components/js/header.js"></script>
    <script defer src="./frontend/simulator/js/editor.js"></script>
    <script defer src="./frontend/simulator/js/canvasView.js"></script>
    <script defer src="./frontend/simulator/js/execution.js"></script>
</head>
<body>
    <div id="header-container"></div>
    <main class="main-container">
        <div class="simulator-grid">
            <!-- Columna izquierda: Editor y Consola -->
            <div class="panel" id="editor-panel">
                <div class="panel-header">
                    <span class="dot" style="background-color: var(--accent-green);"></span>
                    Editor de Código
                </div>
                <div class="editor-container">
                    <div class="editor-wrapper">
                        <div class="line-numbers" id="line-numbers"></div>
                        <textarea class="editor-textarea" id="code-editor" spellcheck="false" placeholder="#include <iostream>
using namespace std;

int main() {
    int x = 10;
    int* ptr = new int(42);
    cout << *ptr << endl;
    delete ptr;
    return 0;
}"></textarea>
                    </div>
                    <div class="controls-bar">
                        <button class="btn btn-primary" id="btn-run">▶ Ejecutar</button>
                        <button class="btn btn-secondary" id="btn-step">⏭ Paso</button>
                        <button class="btn btn-danger" id="btn-reset">↺ Reset</button>
                    </div>
                </div>
                <div class="output-console" id="output-console">
                    // La salida del programa aparecerá aquí...
                </div>
            </div>

            <!-- Columna derecha: Visualización de Memoria -->
            <div class="panel" id="memory-panel">
                <div class="panel-header">
                    <span class="dot" style="background-color: var(--accent-blue);"></span>
                    Visualización de Memoria
                </div>
                <div class="memory-canvas" id="memory-canvas">
                    <div class="memory-section stack-section">
                        <h3 class="memory-section-title text-green">STACK</h3>
                        <div class="memory-blocks" id="stack-blocks"></div>
                    </div>
                    <div class="memory-section heap-section">
                        <h3 class="memory-section-title text-red">HEAP</h3>
                        <div class="memory-blocks" id="heap-blocks"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
